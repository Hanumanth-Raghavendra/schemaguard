spring:
  application:
    name: schemaguard-api
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/plain
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# The API description is public on purpose: it is the API's documentation.
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /v3/api-docs
  # Sorted keys: the document is compared with web/openapi.json, so its order must not vary.
  writer-with-order-by-keys: true

schemaguard:
  limits:
    max-body-bytes: 3000000
    max-input-chars: 1000000
    max-statements: 2000
  cors:
    allowed-origins: ${SCHEMAGUARD_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  # Saved analyses (permalinks) and accounts are off unless SCHEMAGUARD_PERSISTENCE_URL is set,
  # either to a JDBC URL or to a connection string such as postgresql://user:password@host/db?sslmode=require.
  persistence:
    retention: 30d
    max-analysis-bytes: 1000000
    max-total-bytes: 200000000
    pool-size: 3
    connect-timeout: 10s
    # Migrations connect directly, never through a transaction pooler (D-118): set migration-url
    # (SCHEMAGUARD_PERSISTENCE_MIGRATION_URL) for a pooler other than Neon's, whose direct host is
    # found by dropping -pooler from the pooled one.
    migration-lock-timeout: 10s
  # Accounts. SCHEMAGUARD_AUTH_JWT_SECRET (at least 32 characters) signs access tokens; without it a
  # random key is made at startup and access tokens stop working on restart (clients renew them).
  auth:
    access-token-lifetime: 15m
    refresh-token-lifetime: 30d
    session-lifetime: 90d
    refresh-reuse-grace: 30s
  # Per client address (D-116, D-117): requests/period, refilled gradually. A connecting address
  # (Vercel's, or a caller's own) may use connecting-factor times each rate for all it forwards.
  rate-limits:
    enabled: true
    analyses: 60/1m
    shares: 30/1h
    signups: 20/1h
    logins: 30/10m
    connecting-factor: 10
