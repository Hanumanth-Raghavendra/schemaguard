# Render Blueprint: https://render.com/docs/blueprint-spec
# Creates the SchemaGuard API as a free Docker web service. A push to main is deployed only
# after its CI checks pass, and only when it changes something that goes into the image.
services:
  - type: web
    name: schemaguard-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    # Liveness only: the service is alive whether or not the optional database is reachable.
    healthCheckPath: /actuator/health/liveness
    # Wait for the GitHub checks (tests, coverage gates, Docker smoke test): the image build
    # itself skips the tests, so without this a red commit would still go live.
    autoDeployTrigger: checksPass
    # What the Dockerfile copies into the image. Docs, tests, scripts and the future web/
    # folder do not change it, so pushing them does not rebuild or restart the service.
    buildFilter:
      paths:
        - Dockerfile
        - .dockerignore
        - pom.xml
        - mvnw
        - .mvn/**
        - engine/pom.xml
        - engine/src/main/**
        - api/pom.xml
        - api/src/main/**
    envVars:
      # Browser origins allowed to call /api/**: the web app on Vercel and local development.
      # Change it here, not only in the dashboard: a Blueprint sync writes this value back.
      - key: SCHEMAGUARD_CORS_ALLOWED_ORIGINS
        value: https://schemaguard-nu.vercel.app,http://localhost:5173
    # Saved analyses (permalinks) are off until SCHEMAGUARD_PERSISTENCE_URL is added in the
    # dashboard: a PostgreSQL connection string such as Neon's
    # postgresql://user:password@host/db?sslmode=require. It is a secret, so it is not kept here.
