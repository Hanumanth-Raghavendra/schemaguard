# Render Blueprint: https://render.com/docs/blueprint-spec
# Creates the SchemaGuard API as a free Docker web service, rebuilt on every push to main.
services:
  - type: web
    name: schemaguard-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # Origins allowed to call the API from a browser, comma separated.
      # Set it to the address of the web front end once it is deployed.
      - key: SCHEMAGUARD_CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
