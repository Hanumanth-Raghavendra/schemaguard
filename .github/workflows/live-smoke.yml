name: Live smoke test

# Calls a deployed SchemaGuard API the way a client would. Run it by hand after a deploy:
#   gh workflow run live-smoke.yml -f url=https://schemaguard-api-c00y.onrender.com -f persistence=required
# The "browser" job then clicks through the deployed web app (input "web") in Chromium.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Base URL of the deployed API, without a trailing slash
        required: true
        default: https://schemaguard-api-c00y.onrender.com
      persistence:
        description: Whether saved analyses must work (required) or may be switched off (optional)
        required: true
        default: required
        type: choice
        options: [optional, required]
      origin:
        description: A web origin the API must allow (CORS), for example the Vercel address
        required: true
        default: https://schemaguard-v1.vercel.app
      web:
        description: Address of the deployed web app to click through in Chromium; empty skips it
        required: false
        default: https://schemaguard-v1.vercel.app

permissions:
  contents: read

jobs:
  smoke:
    name: Call the live API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      URL: ${{ inputs.url }}
      PERSISTENCE: ${{ inputs.persistence }}
      ORIGIN: ${{ inputs.origin }}
    steps:
      # The CLI's save command is tried against the live site below.
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the CLI
        run: ./mvnw -B -ntp -q -pl cli -am -DskipTests -Djacoco.skip=true package
      - name: Wake the service
        run: |
          # A free Render service sleeps after 15 idle minutes and needs up to a minute to start.
          for i in $(seq 1 30); do
            if curl -fs -m 20 "$URL/actuator/health/liveness" | grep -q UP; then echo "awake after try $i"; exit 0; fi
            sleep 6
          done
          echo "::error::The service did not answer within 3 minutes"; exit 1

      - name: Health, docs and rules
        run: |
          curl -fs "$URL/actuator/health" | jq -e '.status == "UP"'
          curl -fs "$URL/v3/api-docs" | jq -e '.paths | has("/api/v1/report") and has("/api/v1/model") and has("/api/v1/analyses/{id}") and has("/api/v1/auth/signup") and has("/api/v1/account") and has("/api/v1/projects/{id}/versions")'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/swagger-ui/index.html")" = 200
          test "$(curl -fs "$URL/api/v1/rules" | jq length)" -ge 40
          curl -fs "$URL/actuator/info" | jq -r '"Running build " + .build.version + " from " + .build.time' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Analyses
        run: |
          post() { curl -s -m 30 -o body.json -w '%{http_code}' -X POST "$URL$1" -H 'Content-Type: application/json' -d "$2"; }
          BEFORE='CREATE TABLE users (id int PRIMARY KEY, email text);'
          AFTER='CREATE TABLE users (id int PRIMARY KEY, email text NOT NULL); CREATE INDEX users_email_idx ON users (email);'
          COMPARE=$(jq -n --arg b "$BEFORE" --arg a "$AFTER" '{before: $b, after: $a}')

          test "$(post /api/v1/diff "$COMPARE")" = 200 && jq -e '.significant == 2' body.json
          test "$(post /api/v1/report "$COMPARE")" = 200 && jq -e '[.findings[].ruleId] | index("SG-R101") and index("SG-R106")' body.json
          echo "Report: $(jq -r '.score.value|tostring + "/100 " ' body.json)$(jq -r .score.level body.json)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(post /api/v1/plan "$COMPARE")" = 200 && jq -e '.sql | contains("CREATE INDEX CONCURRENTLY")' body.json
          test "$(post /api/v1/model "$COMPARE")" = 200 && jq -e '.tables[0].status == "CHANGED" and ([.tables[0].columns[] | select(.name == "email")][0].status == "CHANGED")' body.json
          LINT=$(jq -n --arg s "$BEFORE" '{schema: $s, migration: "CREATE INDEX CONCURRENTLY i ON users (email);"}')
          test "$(post /api/v1/lint "$LINT")" = 200 && jq -e '.statements[0].findings | length == 0' body.json
          test "$(post /api/v1/report '{"before":"CREATE TABLE (;","after":""}')" = 422 && jq -e '.code == "SG-API-422"' body.json

      - name: Saved analyses
        run: |
          COMPARE='{"before":"CREATE TABLE t (a int);","after":"CREATE TABLE t (a int, b int);"}'
          STATUS=$(curl -s -m 60 -o saved.json -w '%{http_code}' -X POST "$URL/api/v1/analyses/diff" -H 'Content-Type: application/json' -d "$COMPARE")
          if [ "$STATUS" = 201 ]; then
            ID=$(jq -r .id saved.json); TOKEN=$(jq -r .deleteToken saved.json)
            test "$(curl -s -o opened.json -w '%{http_code}' "$URL/api/v1/analyses/$ID")" = 200
            jq -e '.kind == "diff" and .result.significant == 1' opened.json
            test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "$URL/api/v1/analyses/$ID" -H 'X-Delete-Token: wrong')" = 403
            test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "$URL/api/v1/analyses/$ID" -H "X-Delete-Token: $TOKEN")" = 204
            test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/v1/analyses/$ID")" = 404
            echo "Saved analyses: ON (save, open, delete all work)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            DETAIL=$(jq -r '.detail // empty' saved.json 2>/dev/null)
            echo "Saved analyses: HTTP $STATUS - $DETAIL" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$PERSISTENCE" = required ]; then echo "::error::Saved analyses do not work"; exit 1; fi
          fi

      - name: Accounts
        run: |
          # A throwaway account: sign up, use the access token, rotate the refresh cookie, log out,
          # log in, save versions with a login and an API key, delete. Accounts need the database.
          EMAIL="smoke-$(date +%s)-$RANDOM@example.com"
          PASSWORD='a long passphrase for the live smoke test'
          CREDENTIALS=$(jq -n --arg e "$EMAIL" --arg p "$PASSWORD" '{email: $e, password: $p}')
          json() { curl -s -m 60 -H 'Content-Type: application/json' "$@"; }
          STATUS=$(json -c jar -D signup.headers -o session.json -w '%{http_code}' -X POST "$URL/api/v1/auth/signup" -d "$CREDENTIALS")
          if [ "$STATUS" != 201 ]; then
            echo "Accounts: HTTP $STATUS - $(jq -r '.detail // empty' session.json 2>/dev/null)" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$PERSISTENCE" = required ]; then echo "::error::Accounts do not work"; exit 1; fi
            exit 0
          fi
          grep -i '^set-cookie: __Secure-sg-refresh=' signup.headers | grep -i 'httponly' | grep -i 'secure' \
            | grep -i 'samesite=strict' | grep -i 'path=/api/v1/auth'
          ACCESS=$(jq -r .accessToken session.json)
          curl -fs "$URL/api/v1/account" -H "Authorization: Bearer $ACCESS" | jq -e --arg e "$EMAIL" '.email == $e'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/v1/account")" = 401

          OLD=$(awk '$6 == "__Secure-sg-refresh" {print $7}' jar)
          test "$(curl -s -b jar -c jar -o /dev/null -w '%{http_code}' -X POST "$URL/api/v1/auth/refresh")" = 200
          NEW=$(awk '$6 == "__Secure-sg-refresh" {print $7}' jar)
          test -n "$NEW" && test "$OLD" != "$NEW"
          test "$(curl -s -b jar -c jar -o /dev/null -w '%{http_code}' -X POST "$URL/api/v1/auth/logout")" = 204
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/v1/auth/refresh" -b "__Secure-sg-refresh=$NEW")" = 401

          ACCESS=$(json -f -X POST "$URL/api/v1/auth/login" -d "$CREDENTIALS" | jq -r .accessToken)
          # A project of two versions: the second stores the risk of the change; the same schema
          # again is refused. Deleting the account below deletes the project with it.
          AUTH="Authorization: Bearer $ACCESS"
          PROJECT=$(json -f -H "$AUTH" -X POST "$URL/api/v1/projects" -d '{"name":"smoke"}' | jq -r .id)
          VERSIONS="$URL/api/v1/projects/$PROJECT/versions"
          json -f -H "$AUTH" -X POST "$VERSIONS" -d '{"sql":"CREATE TABLE t (id integer PRIMARY KEY);"}' \
            | jq -e '.number == 1 and .risk == null'
          json -f -H "$AUTH" -X POST "$VERSIONS" -d '{"sql":"CREATE TABLE t (id bigint PRIMARY KEY);","label":"wider id"}' \
            | jq -e '.number == 2 and .risk.score > 0 and .label == "wider id"'
          test "$(json -o /dev/null -w '%{http_code}' -H "$AUTH" -X POST "$VERSIONS" -d '{"sql":"CREATE TABLE t (id bigint PRIMARY KEY);"}')" = 409
          curl -fs -H "$AUTH" "$URL/api/v1/projects" | jq -e --arg p "$PROJECT" 'map(select(.id == $p)) | .[0].versionCount == 2'

          # An API key, used as CI would: it lists projects and saves a version, but cannot touch the
          # account; once deleted it is refused. Its value is masked and never printed.
          KEY=$(json -f -H "$AUTH" -X POST "$URL/api/v1/account/keys" -d '{"name":"smoke"}' | jq -r .key)
          echo "::add-mask::$KEY"
          case "$KEY" in sg_*) ;; *) echo "::error::No API key was made"; exit 1 ;; esac
          KEY_AUTH="Authorization: Bearer $KEY"
          curl -fs -H "$KEY_AUTH" "$URL/api/v1/projects" | jq -e --arg p "$PROJECT" 'map(.id) | index($p) != null'
          json -f -H "$KEY_AUTH" -X POST "$VERSIONS" -d '{"sql":"CREATE TABLE t (id bigint PRIMARY KEY, note text);","label":"from a key"}' \
            | jq -e '.number == 3 and .label == "from a key"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$KEY_AUTH" "$URL/api/v1/account")" = 403
          curl -fs -H "$AUTH" "$URL/api/v1/account/keys" | jq -e 'length == 1 and .[0].lastUsedAt != null and (.[0] | has("key") | not)'
          # The CLI saves the next version with the key through the web app's /api, as CI would;
          # the same schema again is "nothing saved", which is not an error.
          printf 'CREATE TABLE t (id bigint PRIMARY KEY, note text, done boolean);\n' > schema.sql
          cli() { SCHEMAGUARD_KEY="$KEY" java -jar cli/target/schemaguard-cli-*-SNAPSHOT.jar "$@"; }
          cli save --project "$PROJECT" --label "from the CLI" --api "$ORIGIN" schema.sql | tee cli.out
          grep -q '^Saved version 4\. The change from version 3 scores ' cli.out
          cli save --project "$PROJECT" --api "$ORIGIN" schema.sql | grep -qx 'Nothing saved: the schema is the same as the project.s latest version\.'
          KEY_ID=$(curl -fs -H "$AUTH" "$URL/api/v1/account/keys" | jq -r '.[0].id')
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$AUTH" -X DELETE "$URL/api/v1/account/keys/$KEY_ID")" = 204
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$KEY_AUTH" "$URL/api/v1/projects")" = 401
          test "$(json -o /dev/null -w '%{http_code}' -X DELETE "$URL/api/v1/account" -H "Authorization: Bearer $ACCESS" \
            -d "$(jq -n --arg p "$PASSWORD" '{password: $p}')")" = 204
          test "$(json -o /dev/null -w '%{http_code}' -X POST "$URL/api/v1/auth/login" -d "$CREDENTIALS")" = 401
          echo "Accounts, projects and API keys: ON (sign up, token, refresh, log out, log in, versions, keys, delete all work)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: CORS
        run: |
          ORIGINS=$(curl -s -o /dev/null -D - -X OPTIONS "$URL/api/v1/diff" -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: POST' | grep -i '^access-control-allow-origin' || true)
          echo "CORS for $ORIGIN: ${ORIGINS:-not allowed}" | tee -a "$GITHUB_STEP_SUMMARY"
          test -n "$ORIGINS" || { echo "::error::The API does not allow $ORIGIN (SCHEMAGUARD_CORS_ALLOWED_ORIGINS in render.yaml)"; exit 1; }

  browser:
    name: Click through the live web app
    needs: smoke
    if: inputs.web != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: The web app forwards /api to the API, cookies included
        env:
          WEB: ${{ inputs.web }}
        run: |
          curl -fs "$WEB/api/v1/rules" | jq -e 'map(.id) | index("SG-R101") != null'
          # Logging out without a session still answers with a cookie that clears the refresh cookie:
          # proof that Set-Cookie survives the Vercel rewrite, without making an account.
          curl -s -D - -o /dev/null -X POST "$WEB/api/v1/auth/logout" | grep -i '^set-cookie: __Secure-sg-refresh=;'
      - name: Analyse, share, an account, a project and an API key on the live site
        env:
          E2E_BASE_URL: ${{ inputs.web }}
        run: |
          npm run test:e2e
          echo "Live web app at $E2E_BASE_URL: analyse, share, accounts, projects and API keys all work" >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-e2e-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
