name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A real PostgreSQL 16 is the judge of every migration plan (PlanOracleTest).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, test and check coverage
        run: ./mvnw -B -ntp verify
        env:
          SG_PG_ORACLE: '1'
          # psql and pg_dump of exactly the server's version: the ones in its own container.
          SG_PG_EXEC: docker exec -i -e PGUSER=postgres ${{ job.services.postgres.id }}

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t schemaguard-api .
      - name: Start it and call the API
        run: |
          docker run -d --name api -p 8080:8080 schemaguard-api
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health | grep -q UP; then break; fi
            sleep 2
          done
          curl -fs http://localhost:8080/actuator/health
          curl -fs -X POST http://localhost:8080/api/v1/report \
            -H 'Content-Type: application/json' \
            -d '{"before":"CREATE TABLE t (a int);","after":"CREATE TABLE t (a int); CREATE INDEX t_a ON t (a);"}' \
            | grep -q SG-R101
          test "$(docker inspect -f '{{.Config.User}}' api)" = "10001"
      - name: Logs on failure
        if: failure()
        run: docker logs api || true
