name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A real PostgreSQL 16 is the judge of every migration plan (PlanOracleTest).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, test and check coverage
        run: ./mvnw -B -ntp verify
        env:
          SG_PG_ORACLE: '1'
          # The API's persistence tests connect over TCP with JDBC.
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          # psql and pg_dump of exactly the server's version: the ones in its own container.
          SG_PG_EXEC: docker exec -i -e PGUSER=postgres ${{ job.services.postgres.id }}
      - name: Run the CLI jar as a user would
        # The runnable jar on the engine's reviewed fixture, and on SchemaGuard's own migrations.
        run: |
          set -euo pipefail
          cli() { java -jar cli/target/schemaguard-cli-*.jar "$@"; }
          g=engine/src/test/resources/golden/evolution
          cli --version
          cli report $g/before_pg_dump_16.sql $g/after_pg_dump_16.sql | diff - $g/expected-report.txt
          cli report $g/before_pg_dump_16.sql $g/after_pg_dump_16.sql --format json | jq -e '.score.value == 100'
          cli report $g/before_pg_dump_16.sql $g/after_pg_dump_16.sql --format markdown | head -1 | grep -qx '# SchemaGuard risk report'
          code=0; cli report $g/before_pg_dump_16.sql $g/after_pg_dump_16.sql --fail-above high > /dev/null || code=$?
          test "$code" = 1
          code=0; cli diff no-such.sql $g/before.sql 2> /dev/null || code=$?
          test "$code" = 2
          cli lint --migrations api/src/main/resources/db/migration --fail-above low
      - name: Lint and test the GitHub Action's script
        run: |
          shellcheck action/schemaguard.sh action/test/test.sh
          action/test/test.sh cli/target/schemaguard-cli-*.jar
      - name: Find the CLI jar
        id: jar
        run: echo "path=$(ls cli/target/schemaguard-cli-*.jar)" >> "$GITHUB_OUTPUT"
      - name: Run the action on SchemaGuard's own migrations
        uses: ./action
        with:
          migrations: api/src/main/resources/db/migration
          files: all
          fail-above: low
          comment: 'false'
          cli-jar: ${{ steps.jar.outputs.path }}
      - name: Run the action on a risky migration
        id: risky
        continue-on-error: true
        uses: ./action
        with:
          migrations: action/test/risky
          files: all
          fail-above: medium
          comment: 'false'
          cli-jar: ${{ steps.jar.outputs.path }}
      - name: The risky migration failed the check
        env:
          OUTCOME: ${{ steps.risky.outcome }}
          EXIT_CODE: ${{ steps.risky.outputs.exit-code }}
          SCORE: ${{ steps.risky.outputs.score }}
          LEVEL: ${{ steps.risky.outputs.level }}
        run: test "$OUTCOME/$EXIT_CODE/$SCORE/$LEVEL" = failure/1/60/HIGH
      - name: Keep the CLI jar
        uses: actions/upload-artifact@v7
        with:
          name: schemaguard-cli
          path: cli/target/schemaguard-cli-*.jar
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t schemaguard-api .
      - name: Start it and call the API
        run: |
          docker run -d --name api -p 8080:8080 schemaguard-api
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health | grep -q UP; then break; fi
            sleep 2
          done
          curl -fs http://localhost:8080/actuator/health
          curl -fs -X POST http://localhost:8080/api/v1/report \
            -H 'Content-Type: application/json' \
            -d '{"before":"CREATE TABLE t (a int);","after":"CREATE TABLE t (a int); CREATE INDEX t_a ON t (a);"}' \
            | grep -q SG-R101
          # Without a database the permalinks say they are off, and nothing else changes.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/v1/analyses/diff \
            -H 'Content-Type: application/json' -d '{"before":"","after":""}')" = "503"
          test "$(docker inspect -f '{{.Config.User}}' api)" = "10001"
      - name: Logs on failure
        if: failure()
        run: docker logs api || true

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Types match the API contract
        # web/openapi.json is checked against the API by OpenApiContractTest; this checks the types against it.
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the API
        run: ./mvnw -B -ntp -DskipTests -pl api -am package
      - name: Start the API with saving, accounts and projects on
        env:
          SCHEMAGUARD_PERSISTENCE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          nohup java -jar "$(ls api/target/schemaguard-api-*.jar)" > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health/readiness && exit 0
            sleep 2
          done
          cat api.log
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build the web app
        working-directory: web
        # Same origin as in production: vite preview forwards /api to the API on port 8080 (D-090).
        run: npm run build
      - name: Analyse and share, an account from sign-up to deletion, and a project, in Chromium
        working-directory: web
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/test-results
            api.log
          retention-days: 7
